# Software from outside OpenWrt, built into the images when a profile lists
# its packages. One source per line:
#
#   NAME  URL  FOLLOW  COMMIT  TYPE  [RELEASE]
#
# FOLLOW is what scripts/bump-upstream.sh moves COMMIT to:
#   release        the source's newest GitHub release (not pre-releases); the
#                  bump writes its tag as RELEASE
#   BRANCH@SOURCE  the commit BRANCH was at when the release that SOURCE
#                  follows was published, for a source without releases of its
#                  own that is used together with one that has them
#   BRANCH         the head of BRANCH, for sources that publish no releases
# Releases are preferred: their authors decided they are ready.
#
# TYPE "feed" is a feed of packages; "package" is a repository holding a
# single package. Packages of these sources win over same-named ones in the
# OpenWrt feeds. Delete a line (and its packages from the profiles) to drop a
# source.
