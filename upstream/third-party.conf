# Software from outside OpenWrt, built into the images when a profile lists
# its packages. One source per line:
#
#   NAME  URL  BRANCH  COMMIT  TYPE
#
# TYPE "feed" is a feed of packages; "package" is a repository holding a
# single package. Packages of these sources win over same-named ones in the
# OpenWrt feeds. scripts/bump-upstream.sh moves COMMIT to the branch's head;
# delete a line (and its packages from the profiles) to drop a source.
passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git main da712cf06cf4e6fd39e147fb36e6ec936003fcc9 feed
passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git main 0b969d5a49743a9725c8dc283b01753c5217dd0d feed
luci-theme-aurora https://github.com/eamonxg/luci-theme-aurora.git master 298dbcc74ddf820923a51285fb0826d429e5d7ca package
luci-app-aurora-config https://github.com/eamonxg/luci-app-aurora-config.git master a5299ce0144859f47683ec3bc40805bf616f534f package
