# Feeds, pinned to their state when the upstream release was built
# (scripts/bump-upstream.sh updates them, following the branch named in each
# "# follows" line). nss and the luci fork (which adds luci-app-qca-ppe-qos)
# are the ones the upstream builds use.
# follows packages master
src-git packages https://github.com/openwrt/packages.git^0d5f51b58e878508ff2df6189b98c6511c33ae51
# follows luci luci-app-ppe-qos
src-git luci https://github.com/JuliusBairaktaris/luci.git^9c746a7ba8f2e8f0624a70d125a81279ed714813
# follows routing master
src-git routing https://github.com/openwrt/routing.git^4b9891b9136259f93294a424507ed24c5e8c1cbd
# follows telephony master
src-git telephony https://github.com/openwrt/telephony.git^9bcb6d71db03377ff49ccb099be763add9a5b059
# follows video master
src-git video https://github.com/openwrt/video.git^4582d70fd21665c4d53b740c76bdf0b390ef9c88
# follows nss ppe-nss (the commit the upstream release names)
src-git nss https://github.com/JuliusBairaktaris/nss-packages.git^1f60d7e9409930bbd298eae1831c5b76d21eb1d2
