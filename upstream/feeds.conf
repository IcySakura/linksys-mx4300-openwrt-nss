src-git luci https://github.com/JuliusBairaktaris/luci.git^9c746a7ba8f2e8f0624a70d125a81279ed714813
# follows routing master
src-git routing https://github.com/openwrt/routing.git^ea8633da9c461a9bdc62a0323439d31180762e03
# follows telephony master
src-git telephony https://github.com/openwrt/telephony.git^9bcb6d71db03377ff49ccb099be763add9a5b059
# follows video master
src-git video https://github.com/openwrt/video.git^81bca9f3f30dabd790df9be111a776e799640a80
# follows nss ppe-nss (the commit the upstream release names)
